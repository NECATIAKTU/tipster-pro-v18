
name: V19 Pilot Testi

on:
  workflow_dispatch:
  push:
    branches: [v19-review]
    paths:
      - 'v19_veri_pilotu.py'
      - 'v19_gercek_tahmin_pilotu.py'
      - 'testler/test_v19_veri_pilotu.py'
      - 'testler/test_v19_gercek_tahmin_pilotu.py'
      - '.github/workflows/v19-pilot-test.yml'

permissions:
  contents: read

jobs:
  pilot-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Kodlari al
        uses: actions/checkout@v4

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: V19 pilot testlerini calistir
        run: |
          
          cd testler
          python -m unittest -v test_v19_veri_pilotu
          python -m unittest -v test_v19_gercek_tahmin_pilotu

# V19 pilot testi yeniden calistirma
