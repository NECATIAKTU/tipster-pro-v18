name: TIPSTER PRO V18 - Gercek Tahmin ve Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tipster-v18-live-pages
  cancel-in-progress: false

jobs:
  predict-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: V18 cevrimdisi testler
        run: python -m unittest -v test_gercek_tahmin_v18.py test_v18_panel_aktar.py

      - name: ESPN guncel fikstur
        env:
          TIPSTER_FIKSTUR_GUN: '7'
        run: python fikstur_yeni.py

      - name: Gercek mac gecmisi ve V18 model tahminleri
        run: python gercek_tahmin_v18.py --gecmis-gun 90 --cikti v18_canli_cikti.json

      - name: V18 tahminlerini arsivle
        run: python v18_sonuc_takip.py --arsivle v18_canli_cikti.json

      - name: V18 gercek mac sonuclarini kontrol et
        run: python v18_sonuc_takip.py --kontrol

      - name: Denetim ve kurtarma dosyalarini sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v18-denetim-${{ github.run_id }}
          path: |
            gelecek_maclar.json
            v18_canli_cikti.json
            v18_tahmin_arsivi.json
            v18_dogrulanan_sonuclar.json
          if-no-files-found: warn
          retention-days: 30

      - name: ASLAN MODU V1 bagimsiz test
        id: aslan_tests
        continue-on-error: true
        run: python -m unittest -v test_aslan_modu_v1

      - name: ASLAN MODU test raporunu olustur
        env:
          ASLAN_TEST_STATUS: ${{ steps.aslan_tests.outcome }}
        run: |
          python - <<'PYCODE'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          durum = os.environ.get('ASLAN_TEST_STATUS', 'unknown')
          rapor = {
              'modul': 'ASLAN MODU V1',
              'tarih_utc': datetime.now(timezone.utc).isoformat(),
              'durum': durum,
              'aciklama': 'ASLAN MODU bagimsiz test durumu: ' + durum,
          }
          Path('aslan_modu_test_sonuclari.json').write_text(
              json.dumps(rapor, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print('ASLAN MODU TEST DURUMU:', durum)
          PYCODE

      - name: ASLAN MODU gercek mac kesif raporunu olustur
        run: |
          rm -f aslan_modu_rapor.json
          python aslan_modu_v1.py --girdi v18_canli_cikti.json --cikti aslan_modu_rapor.json
      - name: ASLAN MODU tahminlerini kilitle ve sonuclari kontrol et
        run: |
          python aslan_sonuc_takip.py --kilitle
          python aslan_sonuc_takip.py --kontrol
      - name: V18 guclendirme V1 bagimsiz test
        continue-on-error: true
        run: python -m unittest -v test_v18_guclendirme_v1.py

      - name: V18 arsivini cakismasiz birlestir ve kalici kaydet
        id: archive_save
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p "$RUNNER_TEMP/v18-save"
          cp v18_tahmin_arsivi.json "$RUNNER_TEMP/v18-save/local-archive.json"
          cp v18_dogrulanan_sonuclar.json "$RUNNER_TEMP/v18-save/local-results.json"
          for attempt in 1 2 3 4 5; do
            echo "ARSIV KAYIT DENEMESI: $attempt"
            git fetch origin main
            git worktree add --detach "$RUNNER_TEMP/v18-worktree" origin/main
            python - "$RUNNER_TEMP/v18-save/local-archive.json" "$RUNNER_TEMP/v18-worktree" <<'PYCODE'
          import json
          import sys
          from pathlib import Path

          source = Path(sys.argv[1])
          destination = Path(sys.argv[2]) / 'v18_tahmin_arsivi.json'
          local = json.loads(source.read_text(encoding='utf-8'))
          remote = json.loads(destination.read_text(encoding='utf-8')) if destination.exists() else []
          if not isinstance(local, list) or not isinstance(remote, list):
              raise SystemExit('Arsiv listesi gecersiz; kayit durduruldu')
          merged = {}
          order = []
          for record in remote:
              if not isinstance(record, dict) or not record.get('kimlik'):
                  raise SystemExit('Uzak arsivde gecersiz kayit')
              key = record['kimlik']
              if key in merged:
                  raise SystemExit('Uzak arsivde tekrar eden kimlik: ' + str(key))
              merged[key] = record
              order.append(key)
          for record in local:
              if not isinstance(record, dict) or not record.get('kimlik'):
                  raise SystemExit('Yerel arsivde gecersiz kayit')
              key = record['kimlik']
              if key not in merged:
                  merged[key] = record
                  order.append(key)
                  continue
              old = merged[key]
              new = dict(old)
              # Existing remote lock is authoritative: never rewrite historical pick.
              for field in ('kilitli_secim', 'kilit_zamani_utc', 'secim_politikasi', 'secim_esikleri'):
                  if field not in new and field in record:
                      new[field] = record[field]
              # A verified score is never downgraded to pending.
              old_done = old.get('durum') == 'DOGRULANDI' and isinstance(old.get('sonuc'), dict)
              local_done = record.get('durum') == 'DOGRULANDI' and isinstance(record.get('sonuc'), dict)
              lock_conflict = (
                  old.get('kilitli_secim') is not None
                  and record.get('kilitli_secim') is not None
                  and old['kilitli_secim'] != record['kilitli_secim']
              )
              if lock_conflict:
                  new['secim_cakisma_uyarisi'] = 'KILITLI_SECIM_FARKLI_MANUEL_KONTROL'
              if local_done and not old_done and not lock_conflict:
                  for field in ('durum', 'sonuc', 'sonuc_dogrulama_zamani_utc', 'cizgi_sonuclari', 'tahmin_sonucu'):
                      if field in record:
                          new[field] = record[field]
              elif local_done and old_done and old['sonuc'].get('skor') != record['sonuc'].get('skor'):
                  new['skor_uyarisi'] = 'ESPN_SKOR_CELISKISI_KONTROL_ET'
              if 'skor_uyarisi' in record:
                  new['skor_uyarisi'] = record['skor_uyarisi']
              merged[key] = new
          output = [merged[key] for key in order]
          destination.write_text(json.dumps(output, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          # Rebuild results from merged archive, not stale local summary.
          from datetime import datetime, timezone
          wins = sum(x.get('tahmin_sonucu') == 'DOGRU' for x in output)
          losses = sum(x.get('tahmin_sonucu') == 'YANLIS' for x in output)
          confirmed = sum(x.get('durum') == 'DOGRULANDI' for x in output)
          summary = {
              'model': 'TIPSTER PRO V18',
              'olusturulma_utc': datetime.now(timezone.utc).isoformat(),
              'toplam_arsiv': len(output), 'dogrulanan_mac': confirmed,
              'bekleyen_mac': len(output) - confirmed,
              'degerlendirilen_tahmin': wins + losses,
              'dogru': wins, 'yanlis': losses,
              'basari_yuzdesi': round(100 * wins / (wins + losses), 2) if wins + losses else None,
              'not': 'Yalnizca mac oncesi kilitli UST secimleri basari hesabina girer. Model olasiliklari basari orani degildir.',
              'kayitlar': output,
          }
          (destination.parent / 'v18_dogrulanan_sonuclar.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print('BIRLESEN ARSIV:', len(output), 'DOGRULANAN:', confirmed)
          PYCODE
            git -C "$RUNNER_TEMP/v18-worktree" add v18_tahmin_arsivi.json v18_dogrulanan_sonuclar.json
            if git -C "$RUNNER_TEMP/v18-worktree" diff --cached --quiet; then
              echo 'ARSIV DEGISECEK KAYIT YOK'
              cp "$RUNNER_TEMP/v18-worktree/v18_tahmin_arsivi.json" v18_tahmin_arsivi.json
              cp "$RUNNER_TEMP/v18-worktree/v18_dogrulanan_sonuclar.json" v18_dogrulanan_sonuclar.json
              git worktree remove --force "$RUNNER_TEMP/v18-worktree"
              exit 0
            fi
            git -C "$RUNNER_TEMP/v18-worktree" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'V18 tahmin ve sonuc arsivini guncelle'
            if git -C "$RUNNER_TEMP/v18-worktree" push origin HEAD:main; then
              echo 'ARSIV BASARIYLA KAYDEDILDI'
              cp "$RUNNER_TEMP/v18-worktree/v18_tahmin_arsivi.json" v18_tahmin_arsivi.json
              cp "$RUNNER_TEMP/v18-worktree/v18_dogrulanan_sonuclar.json" v18_dogrulanan_sonuclar.json
              git worktree remove --force "$RUNNER_TEMP/v18-worktree"
              exit 0
            fi
            git worktree remove --force "$RUNNER_TEMP/v18-worktree"
            sleep 3
          done
          echo 'UYARI: Arsiv push basarisiz; kurtarma dosyalari artifact icinde saklandi.'
          exit 1
      - name: ASLAN MODU kalici arsiv kaydi
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            WT="$RUNNER_TEMP/aslan-worktree"
            git worktree add --detach "$WT" origin/main

            if [ -f "$WT/aslan_tahmin_arsivi.json" ]; then
              cp "$WT/aslan_tahmin_arsivi.json" .
            fi

            python aslan_sonuc_takip.py --kilitle
            python aslan_sonuc_takip.py --kontrol

            cp aslan_tahmin_arsivi.json "$WT/"
            cp aslan_dogrulanan_sonuclar.json "$WT/"

            git -C "$WT" add aslan_tahmin_arsivi.json aslan_dogrulanan_sonuclar.json

            if git -C "$WT" diff --cached --quiet; then
              git worktree remove --force "$WT"
              exit 0
            fi

            git -C "$WT" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'ASLAN kalici arsiv kaydi'

            if git -C "$WT" push origin HEAD:main; then
              git worktree remove --force "$WT"
              echo 'ASLAN ARSIVI KAYDEDILDI'
              exit 0
            fi

            git worktree remove --force "$WT"
            sleep 3
          done
          exit 1
      - name: V18 panel verisini dogrula ve hazirla
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          d = json.loads(Path('v18_canli_cikti.json').read_text(encoding='utf-8'))
          if d.get('model') != 'TIPSTER PRO V18' or not isinstance(d.get('tahminler'), list):
              raise SystemExit('V18 cikti bicimi gecersiz.')
          print('URETILEN TAHMIN:', len(d['tahminler']))
          print('DURUM:', d.get('durum_sayilari', {}))
          print('LIG DENETIMI:', d.get('lig_denetimi', {}))
          if not d['tahminler']:
              raise SystemExit('SIFIR TAHMIN: Bos veri yayinlanmiyor.')
          PYCODE
          python v18_panel_aktar.py v18_tahmin_arsivi.json --cikti panel_tahminler.json
          python - <<'PYCODE'
          import json
          import shutil
          from pathlib import Path
          records = json.loads(Path('panel_tahminler.json').read_text(encoding='utf-8'))['tahminler']
          if not records:
              raise SystemExit('GUNCEL MAC ONCESI TAHMIN YOK: Panel yayinlanmadi.')
          out = Path('site')
          out.mkdir(exist_ok=True)
          for name in (
              'index.html', 'panel.css', 'panel.js', 'panel_tahminler.json',
              'v18_dogrulanan_sonuclar.json', 'aslan_modu_test_sonuclari.json',
              'aslan_modu_rapor.json',
              'aslan_tahmin_arsivi.json',
              'aslan_dogrulanan_sonuclar.json',

          ):
              shutil.copy2(name, out / name)
          print('PANEL ICIN GUNCEL TAHMIN:', len(records))
          PYCODE

      - name: V18 TOP arsivini kalici kaydet
        run: |
          set -euo pipefail
          python -m unittest -v test_v18_top_arsiv
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git worktree add --detach "$RUNNER_TEMP/top-worktree" origin/main
            python v18_top_arsiv.py panel_tahminler.json "$RUNNER_TEMP/top-worktree/v18_top_arsivi.json" "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            git -C "$RUNNER_TEMP/top-worktree" add v18_top_arsivi.json
            if git -C "$RUNNER_TEMP/top-worktree" diff --cached --quiet || { git -C "$RUNNER_TEMP/top-worktree" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'V18 TOP arsiv kaydi' && git -C "$RUNNER_TEMP/top-worktree" push origin HEAD:main; }; then
              cp "$RUNNER_TEMP/top-worktree/v18_top_arsivi.json" site/
              git worktree remove --force "$RUNNER_TEMP/top-worktree"
              cp v18_top_arsiv.js site/
              exit 0
            fi
            git worktree remove --force "$RUNNER_TEMP/top-worktree"
            sleep 3
          done
          exit 1

      - name: GitHub Pages hazirla
        uses: actions/configure-pages@v5

      - name: Paneli ve gercek JSON verisini yukle
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Pages paketinin hazir olmasini bekle
        run: sleep 30
      - name: Sayfayi yayinla
        id: deployment
        uses: actions/deploy-pages@v4
