
name: V19 Ucretsiz Kaynak Kesif Testi


on:
  workflow_dispatch:
  push:
    branches: [v19-review]
    paths:
      - '.github/workflows/v19-kaynak-kesif-test.yml'


permissions:
  contents: read

jobs:
  kaynak-kesfi:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bagimsiz teknik testler
        run: |
          python -m unittest discover -s v19_ucretsiz_kaynak_merkezi/tests -v

      - name: Ucretsiz kaynaklari denetle
        run: |
          python v19_ucretsiz_kaynak_merkezi/merkez.py \
            --limit 10 \
            --cikti v19_kaynak_kesif_raporu.json

      - name: Raporu sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v19-kaynak-kesif-raporu
          path: v19_kaynak_kesif_raporu.json
          if-no-files-found: warn
