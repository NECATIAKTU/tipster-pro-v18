name: TIPSTER PRO - Gol Merkez Toplu Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gol-merkez-test:

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:

      - name: Gelistirme dalini al
        uses: actions/checkout@v6
        with:
          ref: tipster-gelistirme
          persist-credentials: false

      - name: Python kurulumu
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Onceki gelistirme testleri
        run: python -m unittest -v gelistirme_test_v1

      - name: Yeni gol merkezi testleri
        run: |
          python -m unittest -v \
            test_gol_analiz_merkezi \
            test_yuksek_gol_radari_v1 \
            test_kalici_veri_bankasi_v1 \
            test_motor_karsilastirma_merkezi_v1 \
            test_dunya_ligleri_merkezi_v1 \
            test_gol_merkez_entegrasyon_v1
      - name: Kalici Veri Bankasi V2 testleri
        run: python -m unittest -v test_kalici_veri_bankasi_v2

      - name: Kalici Veri Bankasi V2 gercek arsiv testi
        run: |
          set -euo pipefail
          ROOT="$PWD"
          mkdir -p "$RUNNER_TEMP/banka-v2-test"
          cd "$RUNNER_TEMP/banka-v2-test"

          python "$ROOT/kalici_veri_bankasi_v2.py" \
            --arsiv "$ROOT/v18_tahmin_arsivi.json"

          python "$ROOT/kalici_veri_bankasi_v2.py" \
            --arsiv "$ROOT/v18_tahmin_arsivi.json"

          test -s gol_veri_bankasi_v2.json

      - name: Dunya Ligleri Merkezi V2 testleri
        run: python -m unittest -v test_dunya_ligleri_merkezi_v2

      - name: V18 Panel saat guvenlik testleri
        run: python -m unittest -v test_v18_panel_aktar
      - name: V18 Gol Motoru V2 testleri
        run: python -m unittest -v test_gercek_tahmin_v18
      - name: Gercek arsiv ile entegrasyon testi
        run: |
          python gol_merkez_entegrasyon_v1.py \
            --cikti "$RUNNER_TEMP/gol_merkez_test.json"
      - name: Neon Panel V19 kod kontrolu
        run: |
          set -euo pipefail
          node --check panel_neon_v19.js
          node --check panel_mobil_v1.js
          node --check panel.js
          test -s panel_neon_v19.css
          test -s kupa_v19.svg
          grep -Fq 'panel_neon_v19.css' index.html
          grep -Fq 'panel_neon_v19.js' index.html
          grep -Fq 'kupa_v19.svg' index.html
          python -c "import xml.etree.ElementTree as ET; ET.parse('kupa_v19.svg')"
          echo "NEON PANEL V19 KOD KONTROLU OK"
      - name: Test raporunu sakla
        uses: actions/upload-artifact@v6
        with:
          name: gol-merkez-test-raporu
          path: ${{ runner.temp }}/gol_merkez_test.json
          retention-days: 3
