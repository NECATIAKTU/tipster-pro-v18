name: V19 Ucretsiz Entegrasyon Testi

on:
  workflow_dispatch:
  push:
    branches: [v19-review]
    paths:
      - '.github/workflows/v19-ucretsiz-entegrasyon-test.yml'
      - 'v19_panel_entegrasyon.py'
      - 'izinli_ucretsiz_kaynaklar.json'
      - 'tests/test_v19_panel_entegrasyon.py'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: V19 bagimsiz testleri calistir
        run: python -m unittest discover -s tests -p 'test_v19_panel_entegrasyon.py' -v
