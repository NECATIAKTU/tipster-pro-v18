name: ASLAN MODU V1 - Bagimsiz Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aslan-test:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ASLAN MODU testlerini calistir
        run: python -m unittest -v test_aslan_modu_v1
