name: ASLAN MODU V1 - Bagimsiz Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aslan-test:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ASLAN MODU testlerini çalıştır
        id: aslan_tests
        run: |
          python -m unittest -v test_aslan_modu_v1 2>&1 | tee aslan_test_log.txt
          exit ${PIPESTATUS[0]}
        
      - name: ASLAN MODU test raporunu oluştur
        if: always()
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          rapor = {
              "modul": "ASLAN MODU V1",
              "tarih_utc": datetime.now(timezone.utc).isoformat(),
              "durum": "${{ steps.aslan_tests.outcome }}",
              "aciklama": "ASLAN MODU test durumu: ${{ steps.aslan_tests.outcome }}"
          }
          Path("aslan_modu_test_sonuclari.json").write_text(
              json.dumps(rapor, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )
          PY
