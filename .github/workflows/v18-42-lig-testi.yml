
name: TIPSTER PRO V18 - 42 Lig Testi

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lig-kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Dosyalari al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Lig katalogunu ve ESPN erisimini kontrol et
        run: |
          python - <<'PY'
          import ast
          import json
          import urllib.request
          from pathlib import Path

          print("=== V18 LIG KATALOG KONTROLU ===")
          found = []
          for path in Path(".").rglob("*.py"):
              try:
                  tree = ast.parse(path.read_text(encoding="utf-8-sig"))
                  for node in ast.walk(tree):
                      if isinstance(node, ast.Dict):
                          for key in node.keys:
                              if isinstance(key, ast.Constant) and isinstance(key.value, str):
                                  if "." in key.value and len(key.value) < 40:
                                      found.append(key.value)
              except Exception as e:
                  print("OKUNAMADI:", path, e)

          print("Olası lig anahtarlari:", sorted(set(found)))
          print("Bu liste dogrulanmis 42 lig katalogu degildir.")

          url = "https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  data = json.load(response)
              print("ESPN BAGLANTISI: BASARILI")
              print("Premier League etkinlik sayisi:", len(data.get("events", [])))
          except Exception as e:
              print("ESPN BAGLANTISI: BASARISIZ", e)
              raise
          PY
