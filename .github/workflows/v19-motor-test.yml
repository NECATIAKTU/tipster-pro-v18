
name: V19 Motor - Bagimsiz Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v19-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Kaynak kodlarini al
        uses: actions/checkout@v4

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python dosyalarini kontrol et
        run: |
          python -m compileall -q v19_motor

      - name: V19 bagimsiz testlerini calistir
        run: |
          python -m unittest discover -s v19_motor/tests -p "test_*.py" -v
